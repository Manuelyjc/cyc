<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="application-name" content="ASSET MANAGEMENT" />
    <meta name="author" content="Juan Manuel Millan Caceres" />
    <meta name="description" content="training" />
    <meta name="date" content="2024-08-28  04:51 p.m" />
    <meta name="organization" content="BLUECELL COMUNICATION" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <div class="container-header shadow-effect">
            <img src="assets/img/logo-header-ayg.png" alt="Asset Management">
            <a href="./contact.html">contacto</a>
        </div>
    </header>

    <section class="contact-container">
        <a href="./index.html" class="btn-return"><img src="./assets/img/icon-arrow.svg" alt="">
            Volver
        </a>
        <div class="container">
            <div class="content-title-form">
                <div class="title-container">
                    <h1>Contáctenos</h1>
                </div>
                <div class="container-contact">
                    <form action="#" method="GET">
                        <div class="form-group-row">
                            <div class="form-group">
                                <label for="name">Nombre</label>
                                <input type="text" id="name" name="name" placeholder="Escriba su nombre" required>
                            </div>
                            <div class="form-group">
                                <label for="last-name">Apellidos</label>
                                <input type="text" id="last-name" name="last-name" placeholder="Escriba sus apellidos"
                                    required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="phone">Teléfono</label>
                            <input type="number" id="phone" name="phone" placeholder="Escriba su teléfono" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Escriba su email" required>
                        </div>
                        <div class="form-group">
                            <label for="affair">Asunto</label>
                            <input type="text" id="affair" name="affair" placeholder="Escriba su asunto" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Mensaje</label>
                            <textarea id="message" name="message" placeholder="Escriba su mensaje"></textarea>
                        </div>
                        <div class="form-terms">
                            <input type="checkbox" id="checkbox" name="checkbox" required>
                            <p>He leido y acepto los términos de <a href="">Políticas de privacidad</a></p>
                        </div>
                        <button type="submit">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
